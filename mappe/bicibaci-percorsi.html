.leaflet-tooltip {

/* Layout: map-first split; route map on the left, tour sheet + numbered stops on the right; stacks on phones. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --ink:#1d2321; --muted:#5f6864; --line:#d9ddd8;
  --land:#ecebe4; --road:#ffffff; --road-major:#fbf3dc; --road-edge:#d6d3c8; --water:#b9d3dc; --park:#cfe0c3; --wall:#b59b78;
  --t-highlights:#b23a2e; --t-appia:#3f7a3a; --t-panoramic:#2c5aa6; --halo:#ffffff;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141716; --panel:#1c201f; --ink:#e7ebe8; --muted:#9aa49f; --line:#2e3431;
  --land:#1f2322; --road:#343a38; --road-major:#4a463a; --road-edge:#1a1d1c; --water:#22404c; --park:#24382a; --wall:#7d6a52;
  --t-highlights:#f0705f; --t-appia:#79c46d; --t-panoramic:#6f9bf0; --halo:#141716; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141716; --panel:#1c201f; --ink:#e7ebe8; --muted:#9aa49f; --line:#2e3431;
  --land:#1f2322; --road:#343a38; --road-major:#4a463a; --road-edge:#1a1d1c; --water:#22404c; --park:#24382a; --wall:#7d6a52;
  --t-highlights:#f0705f; --t-appia:#79c46d; --t-panoramic:#6f9bf0; --halo:#141716; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 28px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:600 14px/1 var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--t-panoramic);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
#map{height:min(78vh,760px);min-height:420px;border-radius:14px;border:1px solid var(--line);background:var(--land);overflow:hidden}
@media (max-width:860px){#map{height:62vh;min-height:360px}}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.level{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:2px 0 0;line-height:1.1}
.blurb{margin:0;color:var(--muted);font-size:14px}
dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px;margin:0}
dl div{min-width:0} dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
dd{margin:2px 0 0;font:500 15px/1.25 var(--f-mono);font-variant-numeric:tabular-nums}
.meet{font-size:14px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:2px}
.meet b{font-weight:600}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow:auto}
@media (max-width:860px){ol{max-height:none}}
li button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;padding:6px 6px;border-radius:8px;cursor:pointer;font-size:14px}
li button:hover,li button:focus-visible{background:color-mix(in srgb,var(--c) 12%,transparent)}
li button:focus-visible{outline:2px solid var(--c)}

  appia:{name:"Appia",level:"Medium",blurb:"Colosseum to the Appian Way: riding on the original Roman paving, then the Caffarella valley. Some dirt sections.",
    stats:[["Duration","3 h"],["Distance","15 km"],["Climb","60 m"],["Price","€42.50"],["Departs","14:00"],["Level","Medium"]],
    meet:"Via Cavour 302 · Metro B Colosseo", kids:"Not recommended under 12"},
  panoramic:{name:"Panoramic",level:"Hard",blurb:"The hills and viewpoints: Quirinale, Pincio, Campidoglio, Aventine, then along the Tiber to Castel Sant'Angelo. Lots of climbing.",
    stats:[["Duration","3 h"],["Distance","15 km"],["Climb","143 m"],["Price","€56.50"],["Departs","09:45"],["Level","Hard"]],
    meet:"Via del Viminale 5 · Termini", kids:"Kids up to 25 kg ride free in a child seat"}
};
const KEYS = ["highlights","appia","panoramic"];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function decode(a){const o=[];let x=0,y=0;for(let i=0;i<a.length;i+=2){x+=a[i];y+=a[i+1];o.push([x/1e5,y/1e5]);}return o;}
const G = {}; for (const k in BASE) G[k] = BASE[k].map(decode);

const map = L.map("map",{preferCanvas:true,zoomSnap:.25,minZoom:12,maxZoom:18,attributionControl:true});
map.attributionControl.setPrefix(false).addAttribution('Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors');
const canvas = L.canvas({padding:.3});
const baseLayer = L.layerGroup().addTo(map);

function drawBase(){
  baseLayer.clearLayers();
  const add = l => baseLayer.addLayer(l);
  G.park.forEach(p=>add(L.polygon(p,{renderer:canvas,stroke:false,fillColor:css("--park"),fillOpacity:1,interactive:false})));
  G.water.forEach(p=>add(L.polygon(p,{renderer:canvas,stroke:false,fillColor:css("--water"),fillOpacity:1,interactive:false})));
  add(L.polyline(G.minor,{renderer:canvas,color:css("--road"),weight:2.2,interactive:false}));
  add(L.polyline(G.major,{renderer:canvas,color:css("--road-edge"),weight:5.5,interactive:false}));
  add(L.polyline(G.major,{renderer:canvas,color:css("--road-major"),weight:3.8,interactive:false}));
  add(L.polyline(G.wall,{renderer:canvas,color:css("--wall"),weight:2.5,dashArray:"1 4",lineCap:"round",interactive:false}));
}
const AREAS=[["Centro Storico",41.8985,12.4745],["Trastevere",41.8862,12.4675],["Monti",41.8955,12.4935],["Aventino",41.8828,12.4805],["Esquilino",41.8955,12.5040],["Villa Borghese",41.9135,12.4875],["Prati",41.9085,12.4640],["Parco della Caffarella",41.8655,12.5235],["Via Appia Antica",41.8480,12.5185],["Celio",41.8855,12.4985],["Testaccio",41.8775,12.4760]];
AREAS.forEach(([t,a,b])=>L.marker([a,b],{icon:L.divIcon({className:"",html:`<span class="lbl">${t}</span>`,iconSize:[0,0]}),interactive:false,keyboard:false}).addTo(map));

const routeLayer = L.layerGroup().addTo(map);
let current = null, pins = [];

function same(a,b){return Math.abs(a[1]-b[1])<1e-4 && Math.abs(a[2]-b[2])<1e-4;}
function drawRoute(k, withPins){
  const r = ROUTES[k], c = css("--t-"+k);
  routeLayer.addLayer(L.polyline(r.line,{color:css("--halo"),weight:withPins?8:7,opacity:.9,interactive:false}));
  routeLayer.addLayer(L.polyline(r.line,{color:c,weight:withPins?4.5:4,opacity:1,interactive:false}));
  if(!withPins){
    const s=r.stops[0];
    routeLayer.addLayer(L.marker([s[1],s[2]],{icon:pinIcon(k,"S",true),title:INFO[k].name+" start"}).bindTooltip(INFO[k].name+" · "+s[0],{direction:"top",offset:[0,-14]}));
    return;
  }
  const loop = same(r.stops[0], r.stops[r.stops.length-1]);
  const stops = loop ? r.stops.slice(0,-1) : r.stops;
  stops.forEach((s,i)=>{
    const last = !loop && i===stops.length-1;
    const m = L.marker([s[1],s[2]],{icon:pinIcon(k, i===0?"S":(last?"F":String(i)), i===0), title:s[0], zIndexOffset:i===0?1000:0})
      .bindTooltip(s[0],{direction:"top",offset:[0,-12]});
    routeLayer.addLayer(m); pins.push(m);
  });
}
function pinIcon(k,label,big){
  const sz = big?30:24;
  return L.divIcon({className:"",html:`<div class="pin${big?" start":""}" style="--c:var(--t-${k})">${label}</div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
}

function sheet(k){
  const el = document.getElementById("sheet");
  if(k==="all"){
    el.style.setProperty("--c","var(--ink)");
    el.innerHTML = `<div><div class="level">Overview</div><h2>All three tours</h2></div>
      <p class="blurb">Highlights and Appia leave from the same shop on Via Cavour. Panoramic starts at Termini and ends at Castel Sant'Angelo, so it isn't a loop.</p>
      <div class="legend">${KEYS.map(x=>`<span style="--c:var(--t-${x})"><i></i>${INFO[x].name} · ${INFO[x].stats[1][1]} · ${INFO[x].stats[4][1]}</span>`).join("")}</div>
      <dl>${KEYS.map(x=>`<div><dt>${INFO[x].name}</dt><dd>${INFO[x].stats[3][1]}</dd></div>`).join("")}</dl>
      ${note()}`;
    return;
  }
  const r = ROUTES[k], I = INFO[k];
  const loop = same(r.stops[0], r.stops[r.stops.length-1]);
  const stops = loop ? r.stops.slice(0,-1) : r.stops;
  el.style.setProperty("--c",`var(--t-${k})`);
  el.innerHTML = `<div><div class="level">${I.level} · bike or e-bike</div><h2>${I.name}</h2></div>
    <p class="blurb">${I.blurb}</p>
    <dl>${I.stats.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join("")}</dl>
    <div class="meet"><span><b>Meet:</b> ${I.meet}</span><span><b>Kids:</b> ${I.kids}</span>${loop?"<span><b>Loop:</b> ends back at the start</span>":""}</div>
    <ol>${stops.map((s,i)=>{const last=!loop&&i===stops.length-1;return `<li><button data-i="${i}"><span class="n${i===0||last?" end":""}">${i===0?"S":(last?"F":i)}</span><span>${s[0]}</span></button></li>`}).join("")}</ol>
    ${note(r.km)}`;
  el.querySelectorAll("li button").forEach(b=>b.addEventListener("click",()=>{
    const m = pins[+b.dataset.i]; map.flyTo(m.getLatLng(),17,{duration:.6}); m.openTooltip();
  }));
}
function note(km){
  return `<p class="note">Stops are Bici&amp;Baci's own "Cosa vedrai" lists. The order between stops and the exact streets are my reconstruction with a bike router${km?` (this line measures ${km} km)`:""}, so the guides may take different streets. Source: <a href="https://bicibaci.com/tour/" target="_blank" rel="noopener">bicibaci.com/tour</a>.</p>`;
}

function show(k){
  current = k; pins = [];
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", String(t.dataset.k===k)));
  routeLayer.clearLayers();
  if(k==="all"){ KEYS.forEach(x=>drawRoute(x,false)); }
  else drawRoute(k,true);
  const pts = k==="all" ? KEYS.flatMap(x=>ROUTES[x].line) : ROUTES[k].line;
  map.fitBounds(L.latLngBounds(pts),{padding:[28,28]});
  sheet(k);
  try{ localStorage.setItem("bb-tab",k); }catch(e){}
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>show(t.dataset.k)));

function redraw(){ drawBase(); if(current) show(current); }
drawBase();
let start = "highlights";
const h = location.hash.slice(1);
try{ start = (["highlights","appia","panoramic","all"].includes(h) ? h : localStorage.getItem("bb-tab")) || start; }catch(e){}
if(!["highlights","appia","panoramic","all"].includes(start)) start="highlights";
show(start);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
</script>

</body></html>
